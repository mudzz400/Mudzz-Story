{% extends 'base.html' %}{% block content %}<section class="panel" style="max-width:850px;margin:20px auto"><div class="row between" style="align-items:center;gap:12px;flex-wrap:wrap"><div><div class="eyebrow">MUDZZ STORY</div><h1 style="margin:4px 0">KOMUNITAS PUBLIK</h1><p class="muted">Ruang obrolan bersama untuk semua pengguna yang login.</p></div><a class="btn" href="{{ url_for('index') }}">Kembali</a></div><div id="public-chat-log" style="height:min(58vh,560px);overflow:auto;display:flex;flex-direction:column;gap:10px;padding:12px 0"></div><form id="public-chat-form" class="inline" style="gap:8px"><input id="public-chat-input" maxlength="500" placeholder="Tulis pesan ke komunitas..." required style="flex:1;min-width:0"><button class="btn" type="submit">Kirim</button></form><p class="muted small">Jangan kirim kata sandi, kode OTP, atau data pribadi. Pesan dibagikan ke semua pengguna.</p></section><script>(()=>{const log=document.getElementById('public-chat-log'),form=document.getElementById('public-chat-form'),input=document.getElementById('public-chat-input');let last=0;function add(x){const b=document.createElement('div');b.style.cssText='padding:10px 12px;background:#ffffff09;border:1px solid #ffffff12;border-radius:12px;max-width:100%;overflow-wrap:anywhere';const h=document.createElement('b');h.textContent=x.username+' · ';const small=document.createElement('small');small.textContent=x.created_at+' ';const p=document.createElement('div');p.textContent=x.message;b.append(h,small,p);log.append(b);log.scrollTop=log.scrollHeight;last=Math.max(last,x.id)}async function poll(){try{const r=await fetch('/api/komunitas?after='+last),j=await r.json();(j.messages||[]).forEach(add)}catch(e){}}form.addEventListener('submit',async e=>{e.preventDefault();const message=input.value.trim();if(!message)return;input.value='';try{const r=await fetch('/api/komunitas',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})}),j=await r.json();if(!j.ok)alert(j.error||'Gagal mengirim pesan');else poll()}catch(e){alert('Koneksi gagal')}});poll();setInterval(poll,2500)})();</script>{% endblock %}
