<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Mudzz Story QRIS Top Up</title>
<desc id="desc">Banner ilustrasi top up saldo dengan QRIS dan aplikasi pembayaran populer. QR yang digambar hanya dekorasi, bukan QR pembayaran.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10172c"/><stop offset=".55" stop-color="#25184c"/><stop offset="1" stop-color="#0d3438"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a99bff"/><stop offset="1" stop-color="#72eed5"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#8a66ff" stop-opacity=".55"/><stop offset="1" stop-color="#8a66ff" stop-opacity="0"/></radialGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000" flood-opacity=".3"/></filter>
</defs>
<rect width="1200" height="420" rx="32" fill="url(#bg)"/>
<circle cx="1010" cy="170" r="280" fill="url(#glow)"/>
<circle cx="1160" cy="20" r="120" fill="#35d9c4" opacity=".08"/>
<circle cx="780" cy="420" r="200" fill="#9d71ff" opacity=".07"/>
<g font-family="Arial,Helvetica,sans-serif">
 <text x="66" y="72" fill="#bcb8ff" font-size="17" font-weight="700" letter-spacing="5">MUDZZ STORY  ·  DIGITAL WALLET</text>
 <text x="64" y="148" fill="#fff" font-size="56" font-weight="800" letter-spacing="-2">Top up jadi</text>
 <text x="64" y="211" fill="url(#accent)" font-size="56" font-weight="800" letter-spacing="-2">lebih praktis.</text>
 <text x="67" y="252" fill="#c8d0e4" font-size="20">Bayar lewat QRIS dari aplikasi favoritmu.</text>
 <text x="67" y="282" fill="#aeb9d4" font-size="15">Dukungan tergantung aplikasi dan akun pembayaran masing-masing.</text>
