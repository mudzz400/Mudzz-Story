{% extends 'base.html' %}{% block content %}
<div class="panel" style="max-width:460px;margin:35px auto">
<div class="eyebrow">ACCOUNT RECOVERY</div><h1>Lupa password?</h1>
<p class="muted">Masukkan Gmail yang terdaftar. Kode reset berlaku 10 menit.</p>
<form method="post">
{% if not otp_sent %}
<label>Email terdaftar</label><input type="email" name="email" required autocomplete="email" placeholder="nama@gmail.com">
<button style="width:100%;margin-top:16px">Kirim kode reset</button>
{% else %}
<label>Kode OTP dari email</label><input name="otp" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" required autocomplete="one-time-code" placeholder="6 digit kode">
<label>Password baru</label><input name="new_password" type="password" minlength="8" required autocomplete="new-password" placeholder="Minimal 8 karakter">
<button style="width:100%;margin-top:16px">Ubah password</button>
{% endif %}
{% if otp_sent %}<p class="muted small"><a href="{{ url_for('forgot_password', new=1) }}">Ganti email / minta kode baru</a></p>{% endif %}
</form><p class="muted small"><a href="{{ url_for('login') }}">← Kembali ke login</a></p>
</div>
{% endblock %}
